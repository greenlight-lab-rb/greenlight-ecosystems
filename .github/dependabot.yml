# run 1791306109: a change to this file makes Dependabot check now.
# One directory per package manager, each deliberately outdated, so
# Dependabot opens real pull requests that greenlight's end-to-end replays
# are recorded from. See greenlight/docs/testing.md in
# UiPath/trustops-development.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/pip"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/pip-dir/requirements"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/poetry"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/pipenv"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/yarn"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "uv"
    directory: "/uv"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/pip-compile"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/pnpm-lockonly"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    versioning-strategy: "lockfile-only"
  - package-ecosystem: "pip"
    directory: "/poetry-lockonly"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    versioning-strategy: "lockfile-only"
  - package-ecosystem: "docker"
    directory: "/docker-digest"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/pip-group"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/nuget"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "nuget"
    directory: "/nuget-azure"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "gomod"
    directory: "/gomod"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
